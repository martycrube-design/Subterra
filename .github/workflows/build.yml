name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxcomposite-dev libxext-dev libfreetype-dev libfontconfig1-dev \
            libgl1-mesa-dev xvfb

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSUBTERRA_BUILD_SNAPSHOT=ON

      - name: Build
        run: cmake --build build --target Subterra_VST3 Subterra_Standalone SubterraTests SubterraSnapshot

      - name: Engine tests
        run: ./build/SubterraTests_artefacts/Release/SubterraTests

      - name: Every control drives the engine
        run: xvfb-run -a ./build/SubterraSnapshot_artefacts/Release/SubterraSnapshot --check

      - name: Screenshot
        run: xvfb-run -a ./build/SubterraSnapshot_artefacts/Release/SubterraSnapshot subterra-ui.png 1 note=41.2

      - name: pluginval
        run: |
          curl -sL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -q pluginval.zip
          xvfb-run -a ./pluginval --strictness-level 10 --validate-in-process --timeout-ms 600000 \
            build/Subterra_artefacts/Release/VST3/Subterra.vst3

      - uses: actions/upload-artifact@v4
        with:
          name: Subterra-Linux
          path: |
            build/Subterra_artefacts/Release/VST3/Subterra.vst3
            build/Subterra_artefacts/Release/Standalone/Subterra
            subterra-ui.png

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Configure (universal)
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: |
          cmake --build build --config Release --target Subterra_VST3 Subterra_AU Subterra_Standalone SubterraTests -- -quiet

      - name: Engine tests
        run: ./build/SubterraTests_artefacts/Release/SubterraTests

      - name: Ad-hoc sign
        run: |
          for bundle in build/Subterra_artefacts/Release/VST3/Subterra.vst3 \
                        build/Subterra_artefacts/Release/AU/Subterra.component \
                        build/Subterra_artefacts/Release/Standalone/Subterra.app; do
            codesign --force --deep --sign - "$bundle"
          done

      - name: auval
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/Subterra_artefacts/Release/AU/Subterra.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -a | grep -i subterra
          auval -strict -v aufx Sbtr Sbta

      - name: pluginval (VST3 and AU)
        run: |
          curl -sL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process --timeout-ms 600000 \
            build/Subterra_artefacts/Release/VST3/Subterra.vst3
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process --timeout-ms 600000 \
            ~/Library/Audio/Plug-Ins/Components/Subterra.component

      - name: Package
        run: |
          mkdir -p dist
          cp -R build/Subterra_artefacts/Release/VST3/Subterra.vst3 dist/
          cp -R build/Subterra_artefacts/Release/AU/Subterra.component dist/
          cp -R build/Subterra_artefacts/Release/Standalone/Subterra.app dist/
          cp packaging/INSTALL-mac.txt dist/
          (cd dist && ditto -c -k --keepParent . ../Subterra-macOS.zip)

      - uses: actions/upload-artifact@v4
        with:
          name: Subterra-macOS
          path: Subterra-macOS.zip

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --target Subterra_VST3 Subterra_Standalone SubterraTests

      - name: Engine tests
        run: .\build\SubterraTests_artefacts\Release\SubterraTests.exe

      - name: pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          .\pluginval\pluginval.exe --strictness-level 10 --validate-in-process --timeout-ms 600000 build\Subterra_artefacts\Release\VST3\Subterra.vst3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item -Recurse build\Subterra_artefacts\Release\VST3\Subterra.vst3 dist\
          Copy-Item build\Subterra_artefacts\Release\Standalone\Subterra.exe dist\
          Copy-Item packaging\INSTALL-windows.txt dist\
          Compress-Archive -Path dist\* -DestinationPath Subterra-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Subterra-Windows
          path: Subterra-Windows.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Subterra-macOS/Subterra-macOS.zip
            artifacts/Subterra-Windows/Subterra-Windows.zip
