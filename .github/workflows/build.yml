name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxcomposite-dev libxext-dev libfreetype-dev libfontconfig1-dev \
            libgl1-mesa-dev xvfb

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSUBTERRA_BUILD_SNAPSHOT=ON

      - name: Build
        run: cmake --build build --target Subterra_VST3 Subterra_Standalone SubterraTests SubterraSnapshot

      - name: Engine tests
        run: ./build/SubterraTests_artefacts/Release/SubterraTests

      - name: Every control and menu works
        run: xvfb-run -a ./build/SubterraSnapshot_artefacts/Release/SubterraSnapshot --check

      - name: Screenshot
        run: |
          xvfb-run -a ./build/SubterraSnapshot_artefacts/Release/SubterraSnapshot subterra-ui.png 1 note=41.2
          xvfb-run -a ./build/SubterraSnapshot_artefacts/Release/SubterraSnapshot subterra-effects.png 1 page=1 chorusOn=1 delayOn=1 reverbOn=1

      - name: pluginval
        run: |
          curl -sL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -q pluginval.zip
          xvfb-run -a ./pluginval --strictness-level 10 --validate-in-process --timeout-ms 600000 \
            build/Subterra_artefacts/Release/VST3/Subterra.vst3

      - uses: actions/upload-artifact@v4
        with:
          name: Subterra-Linux
          path: |
            build/Subterra_artefacts/Release/VST3/Subterra.vst3
            build/Subterra_artefacts/Release/Standalone/Subterra
            subterra-ui.png
            subterra-effects.png

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Configure (universal)
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: |
          cmake --build build --config Release --target Subterra_VST3 Subterra_AU Subterra_Standalone SubterraTests -- -quiet

      - name: Engine tests
        run: ./build/SubterraTests_artefacts/Release/SubterraTests

      - name: Check binaries run on macOS 11 and later, Intel and Apple Silicon
        shell: bash
        run: |
          A=build/Subterra_artefacts/Release
          fail=0
          for bin in "$A/VST3/Subterra.vst3/Contents/MacOS/Subterra" \
                     "$A/AU/Subterra.component/Contents/MacOS/Subterra" \
                     "$A/Standalone/Subterra.app/Contents/MacOS/Subterra"; do
            echo "::notice::$(lipo -info "$bin" 2>&1)"
            for arch in arm64 x86_64; do
              minos=$(vtool -arch $arch -show-build "$bin" 2>&1 | awk '/minos/ {print $2}')
              [ -z "$minos" ] && minos=$(otool -arch $arch -l "$bin" | awk '/LC_VERSION_MIN_MACOSX/ {f=1} f && /version/ {print $2; exit}')
              echo "::notice::$(basename "$(dirname "$(dirname "$(dirname "$bin")")")") [$arch] minimum macOS: ${minos:-not found}"
              case "$minos" in
                10.*|11.0) ;;
                *) echo "::error::$bin [$arch] needs macOS ${minos:-unknown}"; fail=1 ;;
              esac
            done
          done
          for bundle in "$A/VST3/Subterra.vst3" "$A/AU/Subterra.component" "$A/Standalone/Subterra.app"; do
            echo "::notice::$(basename "$bundle") LSMinimumSystemVersion: $(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$bundle/Contents/Info.plist" 2>&1)"
          done
          echo "::notice::App resources: $(ls "$A/Standalone/Subterra.app/Contents/Resources/" | tr '\n' ' ')"
          exit $fail

      - name: Ad-hoc sign
        run: |
          for bundle in build/Subterra_artefacts/Release/VST3/Subterra.vst3 \
                        build/Subterra_artefacts/Release/AU/Subterra.component \
                        build/Subterra_artefacts/Release/Standalone/Subterra.app; do
            codesign --force --deep --sign - "$bundle"
            codesign --verify --deep --strict --verbose=2 "$bundle"
          done

      - name: auval
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/Subterra_artefacts/Release/AU/Subterra.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -a | grep -i subterra
          auval -strict -v aufx Sbtr Sbta

      - name: pluginval (VST3 and AU)
        run: |
          curl -sL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process --timeout-ms 600000 \
            build/Subterra_artefacts/Release/VST3/Subterra.vst3
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process --timeout-ms 600000 \
            ~/Library/Audio/Plug-Ins/Components/Subterra.component

      - name: Package
        run: |
          A=build/Subterra_artefacts/Release
          VERSION=$(sed -n 's/^project(Subterra VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)

          # Installer: AU + VST3 into /Library/Audio/Plug-Ins, the app into /Applications.
          mkdir -p pkgroot/Library/Audio/Plug-Ins/Components pkgroot/Library/Audio/Plug-Ins/VST3 pkgroot/Applications
          cp -R "$A/AU/Subterra.component" pkgroot/Library/Audio/Plug-Ins/Components/
          cp -R "$A/VST3/Subterra.vst3" pkgroot/Library/Audio/Plug-Ins/VST3/
          cp -R "$A/Standalone/Subterra.app" pkgroot/Applications/

          # Install to exactly these paths, even if another copy exists elsewhere on the Mac.
          pkgbuild --analyze --root pkgroot components.plist
          python3 -c "import plistlib; p = 'components.plist'; c = plistlib.load(open(p, 'rb')); [b.update(BundleIsRelocatable=False) for b in c]; plistlib.dump(c, open(p, 'wb'))"
          plutil -p components.plist

          pkgbuild --root pkgroot --component-plist components.plist \
            --identifier com.subterraaudio.subterra.pkg --version "$VERSION" \
            --install-location / Subterra-macOS-Installer.pkg

          # Zip with the raw plugins for manual installs.
          mkdir -p dist
          cp -R "$A/VST3/Subterra.vst3" "$A/AU/Subterra.component" "$A/Standalone/Subterra.app" dist/
          cp packaging/INSTALL-mac.txt dist/
          (cd dist && ditto -c -k --keepParent . ../Subterra-macOS.zip)

      - uses: actions/upload-artifact@v4
        with:
          name: Subterra-macOS
          path: |
            Subterra-macOS-Installer.pkg
            Subterra-macOS.zip

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --target Subterra_VST3 Subterra_Standalone SubterraTests

      - name: Engine tests
        run: .\build\SubterraTests_artefacts\Release\SubterraTests.exe

      - name: pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          .\pluginval\pluginval.exe --strictness-level 10 --validate-in-process --timeout-ms 600000 build\Subterra_artefacts\Release\VST3\Subterra.vst3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item -Recurse build\Subterra_artefacts\Release\VST3\Subterra.vst3 dist\
          Copy-Item build\Subterra_artefacts\Release\Standalone\Subterra.exe dist\
          Copy-Item packaging\INSTALL-windows.txt dist\
          Compress-Archive -Path dist\* -DestinationPath Subterra-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Subterra-Windows
          path: Subterra-Windows.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Subterra-macOS/Subterra-macOS-Installer.pkg
            artifacts/Subterra-macOS/Subterra-macOS.zip
            artifacts/Subterra-Windows/Subterra-Windows.zip
